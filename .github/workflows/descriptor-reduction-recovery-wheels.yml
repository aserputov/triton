name: Build descriptor reduction recovery wheels

on:
  push:
    branches:
      - codex/tma-descriptor-reduction-recovery-bisect
    paths:
      - .github/workflows/descriptor-reduction-recovery-wheels.yml
      - scripts/bootstrap_and_run_h100_descriptor_reduction_recovery.sh
      - scripts/run_h100_descriptor_reduction_recovery.sh
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: descriptor-reduction-recovery-v1
  PYTHON_VERSION: "3.12"

jobs:
  build-source-wheel:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pre_9219
            commit: 750952252ba7cbbe6cb64af13e00d356f7026a8c
          - label: post_9219
            commit: 483327f0336aac7feb02a0eed45c2a6e2207ca00
          - label: post_9220
            commit: b5e3800aec693eed012da1574c0e95edb20655eb
          - label: post_9221
            commit: bb75a870803727d80bb1900a59b26500f18fec16

    steps:
      - name: Check out exact upstream commit
        uses: actions/checkout@v4
        with:
          repository: triton-lang/triton
          ref: ${{ matrix.commit }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Build wheel
        env:
          MAX_JOBS: "4"
          TRITON_BUILD_PROTON: "OFF"
          TRITON_HOME: ${{ runner.temp }}/triton-home
        run: |
          mkdir -p wheelhouse
          python -m pip wheel \
            --no-build-isolation \
            --no-cache-dir \
            --no-deps \
            --wheel-dir wheelhouse \
            .
          test "$(find wheelhouse -maxdepth 1 -name 'triton-*.whl' | wc -l)" -eq 1
          printf '%s\n' "${{ matrix.commit }}" > source.commit
          tar -C wheelhouse -czf "${{ matrix.label }}.tgz" \
            "$(basename "$(find wheelhouse -maxdepth 1 -name 'triton-*.whl')")"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ matrix.label }}.tgz
            source.commit
          compression-level: 0
          if-no-files-found: error

  publish-release:
    name: Publish checksummed candidate bundle
    needs: build-source-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out runner scripts
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download source candidates
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: source-artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release official/official_3_6_0 official/official_3_7_0
          test "$(cat source-artifacts/pre_9219/source.commit)" = "750952252ba7cbbe6cb64af13e00d356f7026a8c"
          test "$(cat source-artifacts/post_9219/source.commit)" = "483327f0336aac7feb02a0eed45c2a6e2207ca00"
          test "$(cat source-artifacts/post_9220/source.commit)" = "b5e3800aec693eed012da1574c0e95edb20655eb"
          test "$(cat source-artifacts/post_9221/source.commit)" = "bb75a870803727d80bb1900a59b26500f18fec16"
          cp source-artifacts/*/*.tgz release/

          python -m pip download --no-deps --only-binary=:all: \
            --dest official/official_3_6_0 triton==3.6.0
          python -m pip download --no-deps --only-binary=:all: \
            --dest official/official_3_7_0 triton==3.7.0

          tar -C official/official_3_6_0 -czf release/official_3_6_0.tgz \
            "$(basename "$(find official/official_3_6_0 -name 'triton-*.whl')")"
          tar -C official/official_3_7_0 -czf release/official_3_7_0.tgz \
            "$(basename "$(find official/official_3_7_0 -name 'triton-*.whl')")"

          curl -fsSL \
            https://raw.githubusercontent.com/aserputov/triton/b37f9c721c7ee7a0aa4e03691f6e8b4836b2cefe/python/test/microbenchmark/tma_descriptor_load_reduce/bench_desc_load_reduce.py \
            -o release/bench_desc_load_reduce.py
          echo "be0867a4937ecda465067c75a55b01c045afc1c23a0340428a383691f0fbe4e3  release/bench_desc_load_reduce.py" \
            | sha256sum -c -

          cp scripts/run_h100_descriptor_reduction_recovery.sh release/
          cp scripts/bootstrap_and_run_h100_descriptor_reduction_recovery.sh release/
          (
            cd release
            sha256sum \
              *.tgz \
              bench_desc_load_reduce.py \
              run_h100_descriptor_reduction_recovery.sh \
              > SHA256SUMS
          )

      - name: Create or update pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" release/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Descriptor reduction recovery candidates v1" \
              --notes "Prebuilt x86_64 wheels bracketing Triton reduction-lowering PRs #9219-#9221. Generated by GitHub Actions for a short H100 recovery benchmark." \
              --prerelease
          fi
